{% extends "base.html" %}

{% block content %}
<div style="max-width: 820px; margin: 0 auto;">
  <header class="article-header">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="{{ base_url }}/">Home</a>
      <svg class="breadcrumb-separator" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      <span>{{ page.title }}</span>
    </nav>
    <h1 class="article-title">{{ page.title }}</h1>
    {% if page.last_modified %}
    <div class="article-meta">
      <span class="meta-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
        Last Updated: {{ page.last_modified }}
      </span>
    </div>
    {% endif %}
  </header>

  <div class="prose">
    {{ content|safe }}
  </div>
</div>
{% endblock %}
